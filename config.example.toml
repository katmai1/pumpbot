# Copia este archivo como config.toml (sin el .example) y rellena tus valores
# reales. config.toml NUNCA debe subirse a git ni compartirse con nadie
# (ya está en el .gitignore).

[credentials]
pumpportal_api_key = "tu_api_key_real_aqui"
helius_api_key = "tu_helius_key_aqui"
# Solo necesarios si vas a usar --real (RealTradeExecutor / Local Transaction API).
# pumpportal_wallet_private es tu clave privada en base58 (la de un keypair de
# Solana normal, NO la credencial del Lightning Wallet de PumpPortal).
# NUNCA la subas a git ni la compartas — quien la tenga controla los fondos.
pumpportal_wallet_private = ""
pumpportal_wallet_public = ""

[scanner]
observation_window_seconds = 60     # límite MÁXIMO antes de descartar (fallback)
early_trigger_min_seconds = 10      # no compra antes de esto (necesita algo de dato)
max_dev_holding_pct = 8.0           # % máx. del supply que el dev puede comprarse al crear
min_unique_buyers = 10
min_buy_sell_ratio = 1.5
min_bonding_curve_progress = 1.0
max_bonding_curve_progress = 70.0
max_drawdown_from_ath_pct = 20.0    # descarta si el precio ya cayó más de esto
                                     # desde su máximo visto durante la observación

[executor]
buy_amount_sol = 0.01               # tamaño de la posición simulada (o real, si usas RealTradeExecutor)
take_profit_pct = 15.0
stop_loss_pct = 15.0
stop_loss_grace_period_seconds = 15    # tras comprar, ignora el SL este tiempo
take_profit_grace_period_seconds = 15  # tras comprar, ignora el TP este tiempo
max_hold_seconds = 3600             # cierre de seguridad si nunca toca TP/SL
position_status_every_n_trades = 5  # frecuencia del print de P&L en vivo
max_concurrent_positions = 5        # nº máx. de posiciones abiertas a la vez
max_total_exposure_sol = 0.05       # SOL máx. sumando TODAS las posiciones abiertas a la vez

# --- solo aplica si corres con --real (RealTradeExecutor) ---
max_slippage_pct = 10.0             # % de slippage máx. aceptado en compra/venta
priority_fee_sol = 0.0005           # SOL de priority fee por transacción
trade_pool = "auto"                 # 'pump', 'raydium', 'pump-amm', 'auto', etc.
tx_confirm_timeout_seconds = 10.0   # tiempo máx. esperando confirmación on-chain
tx_confirm_poll_interval_seconds = 2.0

[pumpfun]
total_supply = 1000000000           # supply estándar de un token de pump.fun
migration_sol_threshold = 85.0      # SOL acumulado al que migra a Raydium/PumpSwap
                                     # (puede cambiar si pump.fun ajusta parámetros)

[logging]
debug_raw = false                   # true = imprime TODOS los mensajes crudos del WebSocket
candidates_csv_path = "candidates_log.csv"
positions_csv_path = "positions_log.csv"
